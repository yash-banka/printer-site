<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Message</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .receipt-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 0.92rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.2s;
      resize: vertical;
      margin-bottom: 1.2rem;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #555;
      background: white;
    }

    textarea {
      min-height: 120px;
    }

    .char-count {
      font-size: 0.78rem;
      color: #aaa;
      text-align: right;
      margin-top: -1rem;
      margin-bottom: 1.2rem;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #333; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #aaa; cursor: not-allowed; }

    .status {
      margin-top: 1.2rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #edfaf4;
      color: #1a7a4a;
      border: 1px solid #b2e8ce;
      display: block;
    }

    .status.error {
      background: #fff0f0;
      color: #c0392b;
      border: 1px solid #f5c6c6;
      display: block;
    }

    .status.sending {
      background: #f0f4ff;
      color: #3a5bd9;
      border: 1px solid #c5d0f5;
      display: block;
    }

    .divider {
      border: none;
      border-top: 1px dashed #e0e0e0;
      margin: 1.5rem 0;
    }

    .footer {
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
    }

    .status.queued {
      background: #fffbea;
      color: #7a5c00;
      border: 1px solid #f0d060;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="receipt-icon">🧾</div>
    <h1>Send a Message</h1>
    <p class="subtitle">Your message will be printed on a receipt.</p>

    <form id="messageForm">
      <label for="name">Your name (optional)</label>
      <input type="text" id="name" name="name" placeholder="Anonymous" maxlength="40" />

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write something..." maxlength="280" required></textarea>
      <div class="char-count"><span id="charCount">0</span> / 280</div>

      <button type="submit" id="submitBtn">Send to Printer</button>
    </form>

    <div class="status" id="status"></div>

    <hr class="divider" />
    <p class="footer">Messages are printed immediately. Be kind.</p>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────────────
    // Get these from your Supabase project: Settings → API
    const SUPABASE_URL  = 'https://mgetsvjjbxpqbkawexgz.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nZXRzdmpqYnhwcWJrYXdleGd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODUyMzIsImV4cCI6MjA4OTY2MTIzMn0.X1uHqnB34QhtrFdUrOj7AZKvFbyjBk2wzpsKLv6KtC0';
    // ────────────────────────────────────────────────────────────────────────

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    const form      = document.getElementById('messageForm');
    const messageEl = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl  = document.getElementById('status');

    messageEl.addEventListener('input', () => {
      charCount.textContent = messageEl.value.length;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name    = document.getElementById('name').value.trim() || 'Anonymous';
      const message = messageEl.value.trim();
      if (!message) return;

      submitBtn.disabled = true;
      showStatus('sending', 'Sending...');

      const { error } = await db.from('messages').insert({ name, message });

      if (error) {
        showStatus('error', 'Something went wrong. Please try again.');
        console.error(error);
      } else {
        showStatus('success', 'Message sent! It will print shortly.');
        form.reset();
        charCount.textContent = '0';
      }

      submitBtn.disabled = false;
    });

    function showStatus(type, msg) {
      statusEl.className = type ? `status ${type}` : 'status';
      statusEl.textContent = msg;
    }
  </script>
</body>
</html>
