<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Message</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a1c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      gap: 1.5rem;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    .page-title {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f7d51d;
      text-shadow: 2px 2px 0 #000;
    }

    /* ── Name input ──────────────────────────────────────────────────────── */
    .name-field {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .name-field label {
      font-size: 0.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a0a8c0;
    }

    .name-field input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 3px solid #f0f0f0;
      border-radius: 0;
      font-size: 0.55rem;
      font-family: 'Press Start 2P', monospace;
      background: #f0ece0;
      color: #1a1c2c;
      outline: none;
      box-shadow: 4px 4px 0 #000;
    }

    .name-field input:focus { border-color: #f7d51d; }
    .name-field input.invalid { border-color: #ff4466; box-shadow: 4px 4px 0 #000; }

    /* ── Paper wrap ──────────────────────────────────────────────────────── */
    .paper-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Pixel zigzag tears ──────────────────────────────────────────────── */
    .tear-top {
      width: 280px;
      height: 16px;
      background-color: #f0ece0;
      background-image:
        linear-gradient(135deg, #1a1c2c 25%, transparent 25%),
        linear-gradient(225deg, #1a1c2c 25%, transparent 25%);
      background-size: 16px 16px;
      background-repeat: repeat-x;
      background-position: 0 0;
      border-left: 3px solid #000;
      border-right: 3px solid #000;
    }

    .tear-bottom {
      width: 280px;
      height: 16px;
      background-color: #f0ece0;
      background-image:
        linear-gradient(45deg, #1a1c2c 25%, transparent 25%),
        linear-gradient(-45deg, #1a1c2c 25%, transparent 25%);
      background-size: 16px 16px;
      background-repeat: repeat-x;
      background-position: 0 0;
      border-left: 3px solid #000;
      border-right: 3px solid #000;
    }

    /* ── Paper ───────────────────────────────────────────────────────────── */
    .paper {
      width: 280px;
      background: #f0ece0;
      padding: 0.6rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      border-left: 3px solid #000;
      border-right: 3px solid #000;
    }

    /* ── Receipt header ──────────────────────────────────────────────────── */
    .receipt-header {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      color: #1a1c2c;
    }

    .receipt-rule {
      border: none;
      border-top: 2px dashed #888;
      margin: 5px 0;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      min-height: 17px;
      padding: 1px 0;
    }

    .receipt-name {
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55%;
    }

    .receipt-date {
      font-size: 10.5px;
      color: #444;
      white-space: nowrap;
    }

    /* ── Message area ────────────────────────────────────────────────────── */
    .paper-message {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #1a1c2c;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      min-height: 96px;
      padding: 8px 0 4px;
      background: transparent;
      overflow: hidden;
    }

    .paper-message::placeholder { color: #aaa; }

    /* ── Paper image ─────────────────────────────────────────────────────── */
    .paper-image-wrap {
      display: none;
      width: 100%;
      margin: 6px 0 4px;
      position: relative;
    }

    .paper-image-wrap.visible { display: block; }

    .paper-image-wrap img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      filter: contrast(1.05);
    }

    .remove-image {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 2px solid white;
      border-radius: 0;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* ── Camera trigger button ───────────────────────────────────────────── */
    .camera-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 7px;
      background: none;
      border: 2px dashed #999;
      border-radius: 0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      margin-top: 4px;
      transition: border-color 0.1s, color 0.1s;
    }

    .camera-btn:hover { border-color: #555; color: #444; }
    .camera-btn.hidden { display: none; }

    /* ── Send button ─────────────────────────────────────────────────────── */
    .send-btn {
      width: 280px;
      padding: 1rem;
      background: #f7d51d;
      color: #1a1c2c;
      border: 3px solid #000;
      border-radius: 0;
      font-size: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      box-shadow: 5px 5px 0 #000;
      letter-spacing: 0.05em;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .send-btn:hover { background: #ffe040; }
    .send-btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 #000; }
    .send-btn:disabled { background: #888; color: #555; cursor: not-allowed; box-shadow: 5px 5px 0 #000; }

    /* ── Status ──────────────────────────────────────────────────────────── */
    .status {
      font-size: 0.4rem;
      text-align: center;
      min-height: 1.2em;
      color: transparent;
      letter-spacing: 0.06em;
    }

    .status.success { color: #4ade80; }
    .status.error   { color: #ff4466; }
    .status.sending { color: #a0a8c0; }

    /* ── Camera modal ────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      gap: 1.25rem;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .camera-viewport {
      position: relative;
      width: min(320px, 90vw);
      height: min(320px, 90vw);
      overflow: hidden;
      border: 3px solid #f7d51d;
      box-shadow: 5px 5px 0 #000;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .crop-shade {
      position: absolute;
      inset: 0;
      border: none;
      box-shadow: inset 0 0 0 2px rgba(247,213,29,0.6);
      pointer-events: none;
    }

    .modal-hint {
      font-size: 0.4rem;
      color: rgba(255,255,255,0.45);
      text-align: center;
      letter-spacing: 0.06em;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
    }

    .modal-btn {
      padding: 0.7rem 1.5rem;
      border-radius: 0;
      border: 3px solid #fff;
      font-size: 0.45rem;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .modal-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 #000; }
    .modal-btn.capture { background: #f7d51d; color: #1a1c2c; border-color: #000; }
    .modal-btn.cancel  { background: transparent; color: white; }

    #captureCanvas { display: none; }

    /* ── Sent receipt view ───────────────────────────────────────────────── */
    #sentView { display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
    #sentView.visible { display: flex; }

    .sent-message-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #1a1c2c;
      width: 100%;
      padding: 8px 0 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sent-image-wrap { display: none; width: 100%; margin: 6px 0 4px; }
    .sent-image-wrap.visible { display: block; }
    .sent-image-wrap img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.1);
    }

    .receipt-footer-rule { border: none; border-top: 2px dashed #888; margin: 8px 0 4px; }

    .send-another-btn {
      width: 280px;
      padding: 1rem;
      background: transparent;
      color: #f0ece0;
      border: 3px solid #f0ece0;
      border-radius: 0;
      font-size: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      box-shadow: 5px 5px 0 #000;
      letter-spacing: 0.05em;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .send-another-btn:hover { background: rgba(240,236,224,0.1); }
    .send-another-btn:active { transform: translate(5px,5px); box-shadow: 0 0 0 #000; }
  </style>
</head>
<body>

  <!-- Input view -->
  <div id="inputView" style="display:contents">

  <p class="page-title">★ Send a Message ★</p>

  <!-- Name -->
  <div class="name-field">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Required" maxlength="28" autocomplete="off" spellcheck="false" />
  </div>

  <!-- Paper -->
  <div class="paper-wrap">
  <div class="tear-top"></div>
  <div class="paper">

    <!-- Receipt header (live) -->
    <div class="receipt-header">
      <hr class="receipt-rule" />
      <div class="receipt-row">
        <span class="receipt-name" id="paperName">&nbsp;</span>
        <span class="receipt-date" id="paperDate">&nbsp;</span>
      </div>
      <hr class="receipt-rule" />
    </div>

    <!-- Message -->
    <textarea class="paper-message" id="messageInput"
      placeholder="Write your message here..."
      maxlength="600"
      spellcheck="true"
    ></textarea>

    <!-- Captured image -->
    <div class="paper-image-wrap" id="imageWrap">
      <img id="paperImage" alt="" />
      <button class="remove-image" id="removeImage" title="Remove photo">✕</button>
    </div>

    <!-- Camera button -->
    <button class="camera-btn" id="cameraBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Add a photo
    </button>

  </div>
  <div class="tear-bottom"></div>
  </div>

  <!-- Send -->
  <button class="send-btn" id="sendBtn">▶ Send to Printer</button>
  <div class="status" id="statusEl"></div>

  </div><!-- /inputView -->

  <!-- Sent receipt view -->
  <div id="sentView">
    <p class="page-title">★ Message Sent ★</p>
    <div class="paper-wrap">
      <div class="tear-top"></div>
      <div class="paper">
        <div class="receipt-header">
          <hr class="receipt-rule" />
          <div class="receipt-row">
            <span class="receipt-name" id="sentName"></span>
            <span class="receipt-date" id="sentDate"></span>
          </div>
          <hr class="receipt-rule" />
        </div>
        <div class="sent-message-text" id="sentMessage"></div>
        <div class="sent-image-wrap" id="sentImageWrap">
          <img id="sentImage" alt="" />
        </div>
        <hr class="receipt-footer-rule" />
      </div>
      <div class="tear-bottom"></div>
    </div>
    <button class="send-another-btn" id="sendAnotherBtn">↩ Send Another</button>
  </div>

  <!-- Camera modal -->
  <div class="modal-overlay" id="cameraModal">
    <div class="camera-viewport">
      <video id="cameraFeed" autoplay playsinline muted></video>
      <div class="crop-shade"></div>
    </div>
    <p class="modal-hint">Your photo will be square-cropped and printed in greyscale.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancelBtn">Cancel</button>
      <button class="modal-btn capture" id="captureBtn">Use Photo</button>
    </div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    // ── CONFIG ───────────────────────────────────────────────────────────────
    const SUPABASE_URL  = 'https://mgetsvjjbxpqbkawexgz.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nZXRzdmpqYnhwcWJrYXdleGd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODUyMzIsImV4cCI6MjA4OTY2MTIzMn0.X1uHqnB34QhtrFdUrOj7AZKvFbyjBk2wzpsKLv6KtC0';
    // ────────────────────────────────────────────────────────────────────────

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    // Elements
    const nameInput     = document.getElementById('nameInput');
    const messageInput  = document.getElementById('messageInput');
    const paperName     = document.getElementById('paperName');
    const paperDate     = document.getElementById('paperDate');
    const imageWrap     = document.getElementById('imageWrap');
    const paperImage    = document.getElementById('paperImage');
    const removeImage   = document.getElementById('removeImage');
    const cameraBtn     = document.getElementById('cameraBtn');
    const cameraModal   = document.getElementById('cameraModal');
    const cameraFeed    = document.getElementById('cameraFeed');
    const cancelBtn     = document.getElementById('cancelBtn');
    const captureBtn    = document.getElementById('captureBtn');
    const captureCanvas = document.getElementById('captureCanvas');
    const sendBtn       = document.getElementById('sendBtn');
    const statusEl      = document.getElementById('statusEl');
    const inputView     = document.getElementById('inputView');
    const sentView      = document.getElementById('sentView');
    const sentName      = document.getElementById('sentName');
    const sentDate      = document.getElementById('sentDate');
    const sentMessage   = document.getElementById('sentMessage');
    const sentImageWrap = document.getElementById('sentImageWrap');
    const sentImage     = document.getElementById('sentImage');
    const sendAnotherBtn= document.getElementById('sendAnotherBtn');

    // ── Header: live timestamp ───────────────────────────────────────────────
    function getIST() {
      const now = new Date();
      const fmt = (opts) => new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', ...opts }).format(now);
      const day  = fmt({ day: '2-digit' });
      const mon  = fmt({ month: 'short' });
      const yr   = fmt({ year: 'numeric' });
      return { date: `${day} ${mon} ${yr}` };
    }

    function updateHeader() {
      const name = nameInput.value.trim();
      if (name) {
        const { date } = getIST();
        paperName.textContent = name;
        paperDate.textContent = date;
      } else {
        paperName.textContent = '\u00A0';
        paperDate.textContent = '\u00A0';
      }
    }

    nameInput.addEventListener('input', () => {
      nameInput.classList.remove('invalid');
      updateHeader();
    });

    setInterval(updateHeader, 30000);
    updateHeader();

    // ── Auto-grow textarea ───────────────────────────────────────────────────
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = messageInput.scrollHeight + 'px';
    });

    // ── Camera ───────────────────────────────────────────────────────────────
    let stream = null;

    cameraBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1080 } },
        });
        cameraFeed.srcObject = stream;
        cameraModal.classList.add('open');
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
          cameraFeed.srcObject = stream;
          cameraModal.classList.add('open');
        } catch {
          alert('Camera access denied or unavailable.');
        }
      }
    });

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      cameraModal.classList.remove('open');
    }

    cancelBtn.addEventListener('click', stopCamera);

    captureBtn.addEventListener('click', () => {
      const vw = cameraFeed.videoWidth;
      const vh = cameraFeed.videoHeight;
      const size = Math.min(vw, vh);
      const sx = (vw - size) / 2;
      const sy = (vh - size) / 2;

      // Target: 384×384px (2-inch paper at 203 DPI)
      const PRINT_PX = 384;
      captureCanvas.width  = PRINT_PX;
      captureCanvas.height = PRINT_PX;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(cameraFeed, sx, sy, size, size, 0, 0, PRINT_PX, PRINT_PX);

      // Convert to grayscale via luminance
      const imageData = ctx.getImageData(0, 0, PRINT_PX, PRINT_PX);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
        d[i] = d[i + 1] = d[i + 2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);

      paperImage.src = captureCanvas.toDataURL('image/jpeg', 0.72);
      imageWrap.classList.add('visible');
      cameraBtn.classList.add('hidden');
      stopCamera();
    });

    removeImage.addEventListener('click', () => {
      imageWrap.classList.remove('visible');
      paperImage.src = '';
      cameraBtn.classList.remove('hidden');
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function dataURLtoBlob(dataURL) {
      const [header, data] = dataURL.split(',');
      const mime = header.match(/:(.*?);/)[1];
      const binary = atob(data);
      const arr = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    // ── Send ─────────────────────────────────────────────────────────────────
    sendBtn.addEventListener('click', async () => {
      const name    = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name) {
        nameInput.classList.add('invalid');
        nameInput.focus();
        showStatus('error', 'Please enter your name.');
        return;
      }
      if (!message) {
        messageInput.focus();
        showStatus('error', 'Please write a message.');
        return;
      }

      sendBtn.disabled = true;
      showStatus('sending', 'Sending…');

      // Upload image if present
      let image_url = null;
      if (paperImage.src && imageWrap.classList.contains('visible')) {
        const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const blob = dataURLtoBlob(paperImage.src);
        const { error: uploadError } = await db.storage
          .from('message-images')
          .upload(filename, blob, { contentType: 'image/jpeg' });

        if (uploadError) {
          showStatus('error', 'Image upload failed. Please try again.');
          console.error(uploadError);
          sendBtn.disabled = false;
          return;
        }

        const { data: { publicUrl } } = db.storage
          .from('message-images')
          .getPublicUrl(filename);
        image_url = publicUrl;
      }

      const { error } = await db.from('messages').insert({ name, message, image_url });

      if (error) {
        showStatus('error', 'Something went wrong. Please try again.');
        console.error(error);
        sendBtn.disabled = false;
      } else {
        // Populate sent receipt
        const { date } = getIST();
        sentName.textContent = name.toUpperCase();
        sentDate.textContent = date;
        sentMessage.textContent = message;

        if (paperImage.src && imageWrap.classList.contains('visible')) {
          sentImage.src = paperImage.src;
          sentImageWrap.classList.add('visible');
        } else {
          sentImage.src = '';
          sentImageWrap.classList.remove('visible');
        }

        // Swap to sent view
        inputView.style.display = 'none';
        sentView.classList.add('visible');

        // Reset form for next use
        nameInput.value = '';
        messageInput.value = '';
        messageInput.style.height = 'auto';
        imageWrap.classList.remove('visible');
        paperImage.src = '';
        cameraBtn.classList.remove('hidden');
        updateHeader();
        sendBtn.disabled = false;
      }
    });

    sendAnotherBtn.addEventListener('click', () => {
      sentView.classList.remove('visible');
      inputView.style.display = 'contents';
    });

    function showStatus(type, msg) {
      statusEl.className = `status ${type}`;
      statusEl.textContent = msg;
    }
  </script>
</body>
</html>
