<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Message</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fff;
      font-family: 'Inter', sans-serif;
      color: #262626;
    }

    /* ── Animations ──────────────────────────────────────────────────────────── */
    @keyframes fade-in-left {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Page wrapper ────────────────────────────────────────────────────────── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    /* ── Site label ──────────────────────────────────────────────────────────── */
    .site-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      animation: fade-in 0.4s ease both;
    }

    .back-arrow {
      font-size: 13px;
      color: #021CA4;
      text-decoration: none;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .back-arrow:hover { opacity: 1; }

    .site-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #021CA4;
    }

    /* ── Two-column grid ─────────────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
      animation: fade-in-left 0.45s ease both;
      animation-delay: 0.05s;
    }

    /* ── Left: form ──────────────────────────────────────────────────────────── */
    .form-col {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .heading-block {
      margin-bottom: 36px;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      line-height: 1.2;
      color: #262626;
      margin-bottom: 8px;
    }

    .subtext {
      font-size: 14px;
      color: #a3a3a3;
      line-height: 1.5;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      color: #a3a3a3;
      letter-spacing: 0.02em;
    }

    .field input,
    .field textarea {
      border: none;
      border-bottom: 1px solid #e5e5e5;
      outline: none;
      width: 100%;
      padding: 8px 0;
      font: 14px/1.5 'Inter', sans-serif;
      color: #262626;
      background: transparent;
      resize: none;
      transition: border-bottom-color 0.15s;
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: #021CA4;
    }

    .field input.invalid {
      border-bottom-color: #dc2626;
    }

    .field textarea {
      min-height: 80px;
      overflow: hidden;
    }

    /* ── Photo row ───────────────────────────────────────────────────────────── */
    .photo-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .photo-row.hidden { display: none; }

    .photo-link {
      font-size: 14px;
      color: #021CA4;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
      text-decoration-color: rgba(2,28,164,0.2);
      text-underline-offset: 3px;
    }

    .photo-link:hover { text-decoration-color: #021CA4; }

    /* ── Attached image ──────────────────────────────────────────────────────── */
    .attached-image-wrap {
      display: none;
      position: relative;
      margin-bottom: 16px;
    }

    .attached-image-wrap.visible { display: block; }

    .attached-image-wrap img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .remove-image-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    /* ── Send button ─────────────────────────────────────────────────────────── */
    .send-btn {
      background: #021CA4;
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      font: 500 15px/1 'Inter', sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }

    .send-btn:hover { opacity: 0.88; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Status ──────────────────────────────────────────────────────────────── */
    .status {
      font-size: 13px;
      min-height: 1.4em;
      color: transparent;
      margin-top: 10px;
    }

    .status.success { color: #16a34a; }
    .status.error   { color: #dc2626; }
    .status.sending { color: #a3a3a3; }

    /* ── Right: preview column ───────────────────────────────────────────────── */
    .preview-col {
      position: sticky;
      top: 48px;
    }

    .preview-label {
      font-size: 11px;
      color: #a3a3a3;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .preview-inner {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #262626;
    }

    .preview-rule {
      border: none;
      border-top: 1px dashed #ccc;
      margin: 6px 0;
    }

    .preview-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .preview-name {
      font-weight: 700;
      font-size: 12.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .preview-date {
      font-size: 10.5px;
      color: #666;
      white-space: nowrap;
    }

    .preview-message {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 4px 0;
      min-height: 20px;
    }

    .preview-image-wrap {
      display: none;
      width: 100%;
      margin: 4px 0;
    }

    .preview-image-wrap.visible { display: block; }

    .preview-image-wrap img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }

    /* Empty state */
    .preview-empty {
      font-size: 13px;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      padding: 8px 0;
    }

    /* ── Sent view ───────────────────────────────────────────────────────────── */
    #sentView {
      display: none;
    }

    #sentView.visible {
      display: block;
      animation: fade-in 0.35s ease both;
    }

    .sent-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
    }

    .sent-heading {
      font-size: 26px;
      font-weight: 500;
      color: #262626;
      margin-bottom: 8px;
    }

    .sent-subtext {
      font-size: 14px;
      color: #a3a3a3;
      margin-bottom: 32px;
    }

    .sent-receipt {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #262626;
      margin-bottom: 28px;
    }

    .sent-image-wrap { display: none; width: 100%; margin: 4px 0; }
    .sent-image-wrap.visible { display: block; }
    .sent-image-wrap img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }

    .send-another-btn {
      font-size: 14px;
      color: #021CA4;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
      text-decoration-color: rgba(2,28,164,0.2);
      text-underline-offset: 3px;
    }

    .send-another-btn:hover { text-decoration-color: #021CA4; }

    /* ── Camera modal ────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      gap: 20px;
      padding: 24px;
    }

    .modal-overlay.open { display: flex; }

    .camera-viewport {
      position: relative;
      width: min(340px, 90vw);
      height: min(340px, 90vw);
      overflow: hidden;
      border: 2px solid #021CA4;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      font-family: 'Inter', sans-serif;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      padding: 10px 28px;
      font: 500 14px/1 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      letter-spacing: 0.02em;
    }

    .modal-btn.capture { background: #021CA4; color: white; }
    .modal-btn.cancel  { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); }
    .modal-btn:hover   { opacity: 0.85; }

    /* ── Upload preview modal ────────────────────────────────────────────────── */
    .upload-preview-wrap {
      position: relative;
      width: min(340px, 90vw);
      height: min(340px, 90vw);
      border: 2px solid #021CA4;
      overflow: hidden;
      background: white;
    }

    .upload-preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Paper slip (right column) ───────────────────────────────────────────── */
    .paper-wrap-outer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .tear-top {
      width: 280px;
      height: 16px;
      background-color: #f0ece0;
      background-image:
        linear-gradient(135deg, #fff 25%, transparent 25%),
        linear-gradient(225deg, #fff 25%, transparent 25%);
      background-size: 16px 16px;
      background-repeat: repeat-x;
      background-position: 0 0;
    }

    .tear-bottom {
      width: 280px;
      height: 16px;
      background-color: #f0ece0;
      background-image:
        linear-gradient(45deg, #fff 25%, transparent 25%),
        linear-gradient(-45deg, #fff 25%, transparent 25%);
      background-size: 16px 16px;
      background-repeat: repeat-x;
      background-position: 0 0;
    }

    .paper-slip {
      width: 280px;
      background: #f0ece0;
      padding: 0.5rem 0.75rem 0.6rem;
      display: flex;
      flex-direction: column;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      line-height: 1.55;
      color: #1a1c2c;
    }

    .slip-rule {
      border: none;
      border-top: 1px dashed #888;
      margin: 4px 0;
    }

    /* center-aligned block (name, datetime) */
    .slip-center {
      text-align: center;
      padding: 2px 0;
    }

    .slip-name-text {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .slip-datetime {
      font-size: 10.5px;
      color: #444;
    }

    .slip-message {
      text-align: left;
      padding: 6px 0 4px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 36px;
    }

    .slip-message-placeholder {
      color: #bbb;
    }

    .slip-gap { height: 6px; }

    .slip-image-wrap {
      display: none;
      width: 100%;
      margin: 4px 0;
      text-align: center;
    }

    .slip-image-wrap.visible { display: block; }

    .slip-image-wrap img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }

    /* ── Mobile ──────────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .page { padding: 32px 20px 60px; }

      .layout {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .preview-col {
        position: static;
        order: 2; /* preview below form on mobile */
      }

      .form-col { order: 1; }

      .sent-layout {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }

    #captureCanvas { display: none; }
  </style>
</head>
<body>

  <!-- Input view -->
  <div id="inputView">
  <div class="page">

    <div class="site-row">
      <a href="https://yashbanka.com" class="back-arrow">←</a>
      <span class="site-label">message.yashbanka.com</span>
    </div>

    <div class="layout">

      <!-- Left: form -->
      <div class="form-col">
        <div class="heading-block">
          <h1>Send a message</h1>
          <p class="subtext">It'll print on a thermal printer in my room.</p>
        </div>

        <div class="fields">
          <div class="field">
            <label for="nameInput">Name</label>
            <input type="text" id="nameInput" placeholder="Your name" maxlength="28" autocomplete="off" spellcheck="false" />
          </div>

          <div class="field">
            <label for="messageInput">Message</label>
            <textarea id="messageInput" placeholder="Write something..." maxlength="600" spellcheck="true"></textarea>
          </div>
        </div>

        <!-- Photo buttons -->
        <div class="photo-row" id="photoBtns">
          <button class="photo-link" id="cameraBtn">📷 Camera</button>
          <button class="photo-link" id="uploadBtn">↑ Upload</button>
        </div>

        <!-- Attached image -->
        <div class="attached-image-wrap" id="imageWrap">
          <img id="paperImage" alt="" />
          <button class="remove-image-btn" id="removeImage">✕</button>
        </div>

        <button class="send-btn" id="sendBtn">Send</button>
        <div class="status" id="statusEl"></div>
      </div>

      <!-- Right: paper slip preview -->
      <div class="preview-col">
        <p class="preview-label" style="margin-bottom:16px;">Print preview</p>
        <div class="paper-wrap-outer">
          <div class="tear-top"></div>
          <div class="paper-slip">
            <!-- center: NAME bold -->
            <div class="slip-center">
              <span class="slip-name-text" id="previewName">&nbsp;</span>
            </div>
            <!-- -------- -->
            <hr class="slip-rule" />
            <!-- center: date + time + UTC+5:30 -->
            <div class="slip-center slip-datetime" id="previewDatetime">&nbsp;</div>
            <!-- -------- -->
            <hr class="slip-rule" />
            <div class="slip-gap"></div>
            <!-- left: message -->
            <div class="slip-message" id="previewMessage">
              <span class="slip-message-placeholder" id="previewEmpty">Your message will appear here...</span>
            </div>
            <div class="slip-gap"></div>
            <!-- image (centered, if present) -->
            <div class="slip-image-wrap" id="previewImageWrap">
              <img id="previewImage" alt="" />
            </div>
            <!-- -------- bottom rule -->
            <hr class="slip-rule" />
          </div>
          <div class="tear-bottom"></div>
        </div>
      </div>

    </div>
  </div>
  </div><!-- /inputView -->

  <!-- Sent view -->
  <div id="sentView">
  <div class="page">
    <div class="sent-layout">

      <div>
        <h1 class="sent-heading">Sent.</h1>
        <p class="sent-subtext">It's printing now.</p>
        <button class="send-another-btn" id="sendAnotherBtn">Send another</button>
      </div>

      <div class="sent-receipt">
        <hr class="preview-rule" />
        <div class="preview-header-row">
          <span class="preview-name" id="sentName"></span>
          <span class="preview-date" id="sentDate"></span>
        </div>
        <hr class="preview-rule" />
        <div class="preview-message" id="sentMessage"></div>
        <div class="sent-image-wrap" id="sentImageWrap">
          <img id="sentImage" alt="" />
        </div>
        <hr class="preview-rule" />
      </div>

    </div>
  </div>
  </div>

  <!-- Camera modal -->
  <div class="modal-overlay" id="cameraModal">
    <div class="camera-viewport">
      <video id="cameraFeed" autoplay playsinline muted></video>
    </div>
    <p class="modal-hint">Your photo will be square-cropped and printed in greyscale.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancelBtn">Cancel</button>
      <button class="modal-btn capture" id="captureBtn">Use Photo</button>
    </div>
  </div>

  <!-- Upload preview modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="upload-preview-wrap">
      <img id="uploadPreviewImg" alt="" />
    </div>
    <p class="modal-hint">This is exactly what will print. Dithered for best thermal quality.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="uploadCancelBtn">Cancel</button>
      <button class="modal-btn capture" id="uploadConfirmBtn">Use Photo</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none" />
  <canvas id="captureCanvas"></canvas>

  <script>
    // ── CONFIG ────────────────────────────────────────────────────────────────
    const SUPABASE_URL  = 'https://mgetsvjjbxpqbkawexgz.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nZXRzdmpqYnhwcWJrYXdleGd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODUyMzIsImV4cCI6MjA4OTY2MTIzMn0.X1uHqnB34QhtrFdUrOj7AZKvFbyjBk2wzpsKLv6KtC0';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    // Elements
    const nameInput        = document.getElementById('nameInput');
    const messageInput     = document.getElementById('messageInput');
    const photoBtns        = document.getElementById('photoBtns');
    const cameraBtn        = document.getElementById('cameraBtn');
    const uploadBtn        = document.getElementById('uploadBtn');
    const fileInput        = document.getElementById('fileInput');
    const imageWrap        = document.getElementById('imageWrap');
    const paperImage       = document.getElementById('paperImage');
    const removeImage      = document.getElementById('removeImage');
    const previewName      = document.getElementById('previewName');
    const previewDatetime  = document.getElementById('previewDatetime');
    const previewMessage   = document.getElementById('previewMessage');
    const previewEmpty     = document.getElementById('previewEmpty');
    const previewImageWrap = document.getElementById('previewImageWrap');
    const previewImage     = document.getElementById('previewImage');
    const sendBtn          = document.getElementById('sendBtn');
    const statusEl         = document.getElementById('statusEl');
    const inputView        = document.getElementById('inputView');
    const sentView         = document.getElementById('sentView');
    const sentName         = document.getElementById('sentName');
    const sentDate         = document.getElementById('sentDate');
    const sentMessage      = document.getElementById('sentMessage');
    const sentImageWrap    = document.getElementById('sentImageWrap');
    const sentImage        = document.getElementById('sentImage');
    const sendAnotherBtn   = document.getElementById('sendAnotherBtn');
    const cameraModal      = document.getElementById('cameraModal');
    const cameraFeed       = document.getElementById('cameraFeed');
    const cancelBtn        = document.getElementById('cancelBtn');
    const captureBtn       = document.getElementById('captureBtn');
    const captureCanvas    = document.getElementById('captureCanvas');
    const uploadModal      = document.getElementById('uploadModal');
    const uploadPreviewImg = document.getElementById('uploadPreviewImg');
    const uploadCancelBtn  = document.getElementById('uploadCancelBtn');
    const uploadConfirmBtn = document.getElementById('uploadConfirmBtn');

    // ── Format datetime matching server's formatIST ───────────────────────────
    // Output: "27 Mar 2026 14:30 UTC+5:30"
    // Format date and time separately to avoid locale-injected "at" between them.
    function formatPrintDatetime() {
      const now = new Date();
      const tz = { timeZone: 'Asia/Kolkata' };
      const date = new Intl.DateTimeFormat('en-GB', { ...tz, day: '2-digit', month: 'short', year: 'numeric' }).format(now);
      const time = new Intl.DateTimeFormat('en-GB', { ...tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      return `${date} ${time} UTC+5:30`;
    }

    // ── Live print preview ────────────────────────────────────────────────────
    function updatePreview() {
      const name     = nameInput.value.trim();
      const msg      = messageInput.value.trim();
      const hasImage = imageWrap.classList.contains('visible');

      previewName.textContent     = name ? name.toUpperCase() : '\u00A0';
      previewDatetime.textContent = name ? formatPrintDatetime() : '\u00A0';

      if (msg) {
        previewEmpty.style.display = 'none';
        previewMessage.childNodes.forEach(n => { if (n !== previewEmpty) n.remove(); });
        previewMessage.insertBefore(document.createTextNode(msg), previewEmpty);
      } else {
        previewMessage.childNodes.forEach(n => { if (n !== previewEmpty) n.remove(); });
        previewEmpty.style.display = '';
      }

      if (hasImage && paperImage.src) {
        previewImage.src = paperImage.src;
        previewImageWrap.classList.add('visible');
      } else {
        previewImageWrap.classList.remove('visible');
        previewImage.src = '';
      }
    }

    nameInput.addEventListener('input', () => {
      nameInput.classList.remove('invalid');
      updatePreview();
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = messageInput.scrollHeight + 'px';
      updatePreview();
    });

    // ── Floyd-Steinberg dithering ─────────────────────────────────────────────
    function applyDither(ctx, width, height) {
      const img = ctx.getImageData(0, 0, width, height);
      const d = img.data;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const old = d[i];
          const nw  = old < 128 ? 0 : 255;
          const err = old - nw;
          d[i] = d[i+1] = d[i+2] = nw; d[i+3] = 255;
          if (x+1 < width) {
            const j = i+4; d[j]=d[j+1]=d[j+2]=Math.min(255,Math.max(0,d[j]+err*7/16));
          }
          if (y+1 < height) {
            if (x-1 >= 0) {
              const j=((y+1)*width+(x-1))*4; d[j]=d[j+1]=d[j+2]=Math.min(255,Math.max(0,d[j]+err*3/16));
            }
            const j2=((y+1)*width+x)*4; d[j2]=d[j2+1]=d[j2+2]=Math.min(255,Math.max(0,d[j2]+err*5/16));
            if (x+1<width) {
              const j3=((y+1)*width+(x+1))*4; d[j3]=d[j3+1]=d[j3+2]=Math.min(255,Math.max(0,d[j3]+err*1/16));
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // ── Shared: crop → brighten → grayscale → dither → PNG ───────────────────
    function processImageToCanvas(source, sourceW, sourceH) {
      const PRINT_PX = 384;
      const size = Math.min(sourceW, sourceH);
      const sx = (sourceW - size) / 2;
      const sy = (sourceH - size) / 2;

      captureCanvas.width  = PRINT_PX;
      captureCanvas.height = PRINT_PX;
      const ctx = captureCanvas.getContext('2d');
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, PRINT_PX, PRINT_PX);
      ctx.drawImage(source, sx, sy, size, size, 0, 0, PRINT_PX, PRINT_PX);

      const imageData = ctx.getImageData(0, 0, PRINT_PX, PRINT_PX);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = Math.min(255, d[i]   + 20);
        const g = Math.min(255, d[i+1] + 20);
        const b = Math.min(255, d[i+2] + 20);
        const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
        d[i] = d[i+1] = d[i+2] = gray; d[i+3] = 255;
      }
      ctx.putImageData(imageData, 0, 0);
      applyDither(ctx, PRINT_PX, PRINT_PX);

      paperImage.src = captureCanvas.toDataURL('image/png');
      imageWrap.classList.add('visible');
      photoBtns.classList.add('hidden');
      updatePreview();
    }

    // ── Camera ────────────────────────────────────────────────────────────────
    let stream = null;

    cameraBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1080 } },
        });
        cameraFeed.srcObject = stream;
        cameraModal.classList.add('open');
      } catch {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
          cameraFeed.srcObject = stream;
          cameraModal.classList.add('open');
        } catch {
          alert('Camera access denied or unavailable.');
        }
      }
    });

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      cameraModal.classList.remove('open');
    }

    cancelBtn.addEventListener('click', stopCamera);

    captureBtn.addEventListener('click', () => {
      processImageToCanvas(cameraFeed, cameraFeed.videoWidth, cameraFeed.videoHeight);
      stopCamera();
    });

    // ── Upload ────────────────────────────────────────────────────────────────
    let pendingUploadDataURL = null;

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const PRINT_PX = 384;
        const sw = img.naturalWidth, sh = img.naturalHeight;
        const size = Math.min(sw, sh);
        const sx = (sw - size) / 2, sy = (sh - size) / 2;

        captureCanvas.width  = PRINT_PX;
        captureCanvas.height = PRINT_PX;
        const ctx = captureCanvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, PRINT_PX, PRINT_PX);
        ctx.drawImage(img, sx, sy, size, size, 0, 0, PRINT_PX, PRINT_PX);

        const imageData = ctx.getImageData(0, 0, PRINT_PX, PRINT_PX);
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = Math.min(255, d[i]   + 20);
          const g = Math.min(255, d[i+1] + 20);
          const b = Math.min(255, d[i+2] + 20);
          const gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
          d[i] = d[i+1] = d[i+2] = gray; d[i+3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        applyDither(ctx, PRINT_PX, PRINT_PX);

        pendingUploadDataURL = captureCanvas.toDataURL('image/png');
        uploadPreviewImg.src = pendingUploadDataURL;
        uploadModal.classList.add('open');
        URL.revokeObjectURL(url);
      };
      img.src = url;
      fileInput.value = '';
    });

    uploadConfirmBtn.addEventListener('click', () => {
      if (!pendingUploadDataURL) return;
      paperImage.src = pendingUploadDataURL;
      imageWrap.classList.add('visible');
      photoBtns.classList.add('hidden');
      pendingUploadDataURL = null;
      uploadPreviewImg.src = '';
      uploadModal.classList.remove('open');
      updatePreview();
    });

    uploadCancelBtn.addEventListener('click', () => {
      pendingUploadDataURL = null;
      uploadPreviewImg.src = '';
      uploadModal.classList.remove('open');
    });

    removeImage.addEventListener('click', () => {
      imageWrap.classList.remove('visible');
      paperImage.src = '';
      photoBtns.classList.remove('hidden');
      updatePreview();
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function dataURLtoBlob(dataURL) {
      const [header, data] = dataURL.split(',');
      const mime = header.match(/:(.*?);/)[1];
      const binary = atob(data);
      const arr = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function showStatus(type, msg) {
      statusEl.className = `status ${type}`;
      statusEl.textContent = msg;
    }

    // ── Send ──────────────────────────────────────────────────────────────────
    sendBtn.addEventListener('click', async () => {
      const name    = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name) {
        nameInput.classList.add('invalid');
        nameInput.focus();
        showStatus('error', 'Please enter your name.');
        return;
      }
      if (!message) {
        messageInput.focus();
        showStatus('error', 'Please write a message.');
        return;
      }

      sendBtn.disabled = true;
      showStatus('sending', 'Sending…');

      let image_url = null;
      if (paperImage.src && imageWrap.classList.contains('visible')) {
        const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.png`;
        const blob = dataURLtoBlob(paperImage.src);
        const { error: uploadError } = await db.storage
          .from('message-images')
          .upload(filename, blob, { contentType: 'image/png' });

        if (uploadError) {
          showStatus('error', 'Image upload failed. Please try again.');
          sendBtn.disabled = false;
          return;
        }

        const { data: { publicUrl } } = db.storage
          .from('message-images')
          .getPublicUrl(filename);
        image_url = publicUrl;
      }

      const { error } = await db.from('messages').insert({ name, message, image_url });

      if (error) {
        showStatus('error', 'Something went wrong. Please try again.');
        sendBtn.disabled = false;
      } else {
        sentName.textContent = name.toUpperCase();
        sentDate.textContent = formatPrintDatetime();
        sentMessage.textContent = message;

        if (paperImage.src && imageWrap.classList.contains('visible')) {
          sentImage.src = paperImage.src;
          sentImageWrap.classList.add('visible');
        } else {
          sentImage.src = '';
          sentImageWrap.classList.remove('visible');
        }

        inputView.style.display = 'none';
        sentView.classList.add('visible');

        // Reset
        nameInput.value = '';
        messageInput.value = '';
        messageInput.style.height = 'auto';
        imageWrap.classList.remove('visible');
        paperImage.src = '';
        photoBtns.classList.remove('hidden');
        updatePreview();
        sendBtn.disabled = false;
      }
    });

    sendAnotherBtn.addEventListener('click', () => {
      sentView.classList.remove('visible');
      inputView.style.display = '';
    });
  </script>
</body>
</html>
